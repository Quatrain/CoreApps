name: Publish Studio-Image Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'containers/studio-image/**'
      - 'apps/studio-api/**'
      - 'apps/studio-web/**'
  workflow_run:
    workflows: ["Publish Independent Packages"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  SOVEREIGN_REGISTRY: git.qtrn.io
  IMAGE_NAME: ${{ github.repository_owner }}/studio-image

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # NOSONAR

      - name: Get version from package.json
        id: package-version
        run: echo "VERSION=$(jq -r .version containers/studio-image/package.json)" >> $GITHUB_ENV

      - name: Prepare package.json for NPM registry (Immutable versions)
        uses: Quatrain/actions/prepare-package-json@v1
        with:
          package_json_path: 'containers/studio-image/package.json'
          dependency_prefix: '@quatrain/'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3 # NOSONAR
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Sovereign Container registry (git.qtrn.io)
        if: env.QTRN_REGISTRY_USER != '' && env.QTRN_REGISTRY_TOKEN != ''
        env:
          QTRN_REGISTRY_USER: ${{ secrets.QTRN_REGISTRY_USER }}
          QTRN_REGISTRY_TOKEN: ${{ secrets.QTRN_REGISTRY_TOKEN }}
        uses: docker/login-action@v3 # NOSONAR
        with:
          registry: ${{ env.SOVEREIGN_REGISTRY }}
          username: ${{ env.QTRN_REGISTRY_USER }}
          password: ${{ env.QTRN_REGISTRY_TOKEN }}

      - name: Determine target container registries
        id: registries
        env:
          QTRN_REGISTRY_USER: ${{ secrets.QTRN_REGISTRY_USER }}
          QTRN_REGISTRY_TOKEN: ${{ secrets.QTRN_REGISTRY_TOKEN }}
        run: |
          {
            echo "images<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            if [ -n "$QTRN_REGISTRY_USER" ] && [ -n "$QTRN_REGISTRY_TOKEN" ]; then
              echo "${{ env.SOVEREIGN_REGISTRY }}/${{ env.IMAGE_NAME }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5 # NOSONAR
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # NOSONAR
        with:
          context: containers/studio-image
          file: containers/studio-image/ContainerFile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Sync with remote to avoid push conflicts
        run: |
          git config pull.rebase true
          git pull origin ${{ github.ref_name }} --autostash

      - name: Bump package version and push tag
        if: github.ref == 'refs/heads/main'
        uses: Quatrain/actions/push-tag@v1
        with:
          bump_type: 'patch'
          working_directory: 'containers/studio-image'
