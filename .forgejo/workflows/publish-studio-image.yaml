name: Publish Studio Image Container

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'containers/studio-image/**'
      - 'apps/studio-api/**'
      - 'apps/studio-web/**'
      - 'bin/publish_container.sh'
      - '.forgejo/workflows/publish-studio-image.yaml'
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://127.0.0.1:2375

concurrency:
  group: publish-studio-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Push Studio Image to qtrn.io
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: apt-get update -qq && apt-get install -y -qq jq

      - name: Build, push and tag release
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # arm64 only: bun crashes under QEMU x86_64 emulation while installing the native
          # sqlite3 module, so the amd64 variant cannot be built on the arm64 runners.
          PLATFORMS: linux/arm64
        run: bin/publish_container.sh studio-image
