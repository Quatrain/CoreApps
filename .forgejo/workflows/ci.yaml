name: Quatrain CoreApps Sovereign CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://127.0.0.1:2375

jobs:
  test-and-build:
    name: Build Containers & Validate Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq && apt-get install -y -qq docker.io
          docker version

      - name: Build API Gateway Container Image
        run: |
          echo "=== Building API Gateway Container ==="
          docker build -t qtrn.io/quatrain/api-gateway:test -f containers/api-gateway/ContainerFile containers/api-gateway

      - name: Build Studio Image Container
        run: |
          echo "=== Building Studio Image Container ==="
          docker build -t qtrn.io/quatrain/studio-image:test -f containers/studio-image/ContainerFile containers/studio-image

      - name: Log in to Sovereign Container Registry
        run: |
          echo "=== Authenticating with qtrn.io ==="
          REG_USER="${{ secrets.REGISTRY_USER }}"
          REG_PASS="${{ secrets.REGISTRY_TOKEN }}"
          if [ -z "$REG_USER" ]; then
            REG_USER="${{ github.actor }}"
          fi
          if [ -z "$REG_PASS" ]; then
            REG_PASS="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$REG_PASS" | docker login qtrn.io -u "$REG_USER" --password-stdin

      - name: Build & Publish DB Migrator Container
        run: |
          echo "=== Building & Publishing DB Migrator Container ==="
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          docker build \
            --file containers/db-migrator/ContainerFile \
            --tag "qtrn.io/quatrain/db-migrator:latest" \
            --tag "qtrn.io/quatrain/db-migrator:${{ github.sha }}" \
            --tag "qtrn.io/quatrain/db-migrator:${SAFE_REF}" \
            containers/db-migrator
          docker push "qtrn.io/quatrain/db-migrator:latest"
          docker push "qtrn.io/quatrain/db-migrator:${{ github.sha }}"
          docker push "qtrn.io/quatrain/db-migrator:${SAFE_REF}"

